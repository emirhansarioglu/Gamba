services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gamba
      POSTGRES_PASSWORD: gamba
      POSTGRES_DB: gamba
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-tutorial
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"